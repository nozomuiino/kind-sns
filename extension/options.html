<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>やさしいTL 設定</title>
<style>
  :root { --bg:#f7f8f6; --card:#fff; --ink:#1f2421; --sub:#6b726d; --line:#e2e5e1; --accent:#4f7a58; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141715; --card:#1d211e; --ink:#e7ebe8; --sub:#98a09a; --line:#2e332f; --accent:#8fbf98; } }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,"Hiragino Sans",system-ui,sans-serif; }
  main { max-width:560px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 20px; margin-bottom:16px; }
  h2 { font-size:14px; color:var(--sub); margin:0 0 12px; font-weight:600; }
  label { display:block; margin:10px 0; }
  input[type=text], input[type=password], input[type=number] { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .row { display:flex; gap:12px; } .row label { flex:1; }
  .cat { display:flex; gap:10px; align-items:center; margin:10px 0; } .cat span { flex:1; } .cat input[type=number] { width:72px; }
  .mode { display:flex; gap:10px; align-items:flex-start; }
  .mode small, .hint { color:var(--sub); display:block; font-size:13px; }
  button { font:inherit; padding:8px 16px; border-radius:999px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  #status, #test-result { margin-left:10px; color:var(--sub); font-size:13px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>やさしいTL</h1>
  <p class="lead">X のタイムラインで、注目集めのためにあおったり攻撃したりする投稿を jev で判定してたたみます。</p>

  <section>
    <h2>jev への接続</h2>
    <label>TypeSafe API キー
      <input id="apiKey" type="password" autocomplete="off" placeholder="ここに貼り付け">
      <span class="hint">この拡張の中（chrome.storage.local）にだけ保存されます。</span>
    </label>
    <div class="row">
      <label>モデル <input id="model" type="text"></label>
      <label>エンドポイント <input id="endpoint" type="text"></label>
    </div>
    <button class="ghost" id="test">接続テスト</button><span id="test-result"></span>
  </section>

  <section>
    <h2>たたむ分類</h2>
    <p class="hint">チェックした分類のどれかに、しきい値以上の確率で当てはまるとたたみます（0〜1、下げるほどたたみやすい）。分類の中身は categories.js で変えられます。</p>
    <div id="cats"></div>
  </section>

  <section>
    <h2>たたんだときの見せ方</h2>
    <label class="mode"><input type="radio" name="mode" value="notice"><span>明示する<small>「たたみました（あおり）」と理由つきの一行を残す。クリックで表示。</small></span></label>
    <label class="mode"><input type="radio" name="mode" value="quiet"><span>控えめ<small>細い点線だけ残す。ホバーで理由、クリックで表示。</small></span></label>
    <label class="mode"><input type="radio" name="mode" value="silent"><span>完全に非表示<small>何も残さない。隠した件数はツールバーのバッジにだけ出る。</small></span></label>
    <label><input id="dimPending" type="checkbox"> 判定が終わるまで投稿を薄く表示する</label>
    <label><input id="enabled" type="checkbox"> この拡張を有効にする</label>
  </section>

  <button id="save">保存</button><span id="status"></span>
</main>
<script src="categories.js"></script>
<script src="settings.js"></script>
<script src="options.js"></script>
</body>
</html>
